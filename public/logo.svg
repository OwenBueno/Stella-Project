<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141029" />
      <stop offset="100%" stop-color="#080612" />
    </linearGradient>

    <!-- Horizon/Planet Gradient -->
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1338" />
      <stop offset="100%" stop-color="#07050e" />
    </linearGradient>

    <!-- Horizon Glowing Edge -->
    <linearGradient id="horizonGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d215a" stop-opacity="0" />
      <stop offset="15%" stop-color="#a461b5" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffd59e" stop-opacity="1" />
      <stop offset="85%" stop-color="#a461b5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3d215a" stop-opacity="0" />
    </linearGradient>

    <!-- Golden Ring Gradient -->
    <linearGradient id="goldRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e5221" />
      <stop offset="30%" stop-color="#ffd39b" />
      <stop offset="70%" stop-color="#b88344" />
      <stop offset="100%" stop-color="#fdf3d8" />
    </linearGradient>

    <!-- Winding Road Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4b8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#e29b53" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1a1338" stop-opacity="0.05" />
    </linearGradient>

    <!-- Star Shading Gradients (3D Facets) -->
    <linearGradient id="goldVeryLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8df" />
      <stop offset="100%" stop-color="#eec285" />
    </linearGradient>
    
    <linearGradient id="goldMedium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eec285" />
      <stop offset="100%" stop-color="#ab7939" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8f5d21" />
      <stop offset="100%" stop-color="#462807" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Background Stars & Atmosphere -->
  <g opacity="0.6">
    <!-- Starfield Dots -->
    <circle cx="150" cy="130" r="1.5" fill="#ffebaa" opacity="0.8" />
    <circle cx="200" cy="160" r="1" fill="#ffffff" opacity="0.5" />
    <circle cx="320" cy="120" r="2" fill="#ffebaa" opacity="0.9" />
    <circle cx="350" cy="150" r="1" fill="#ffffff" opacity="0.6" />
    <circle cx="220" cy="90" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="290" cy="80" r="1" fill="#ffebaa" opacity="0.5" />
    <circle cx="100" cy="240" r="1.5" fill="#ffebaa" opacity="0.8" />
    <circle cx="410" cy="240" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="125" cy="170" r="1" fill="#ffffff" opacity="0.4" />
    <circle cx="380" cy="170" r="1.5" fill="#ffebaa" opacity="0.7" />
    
    <!-- Mini 4-Point Star Left -->
    <path d="M 120 92 Q 120 100 128 100 Q 120 100 120 108 Q 120 100 112 100 Q 120 100 120 92 Z" fill="#ffebaa" opacity="0.9" />
    <!-- Mini 4-Point Star Right -->
    <path d="M 390 94 Q 390 100 396 100 Q 390 100 390 106 Q 390 100 384 100 Q 390 100 390 94 Z" fill="#ffebaa" opacity="0.8" />
  </g>

  <!-- Ambient Light/Glow Behind Star -->
  <circle cx="256" cy="190" r="110" fill="#ffb475" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="256" cy="280" r="70" fill="#9d52b5" opacity="0.2" filter="url(#softGlow)" />

  <!-- The Halo/Ring -->
  <circle cx="256" cy="190" r="96" stroke="url(#goldRingGrad)" stroke-width="2.5" fill="none" opacity="0.6" />
  <circle cx="256" cy="190" r="96" stroke="#ffd39b" stroke-width="1.5" fill="none" opacity="0.4" filter="url(#glow)" />

  <!-- 3D Faceted Stella Star -->
  <!-- Center of star is at (256, 190) -->
  <g id="stellaStar">
    <!-- Top-Right Facet -->
    <polygon points="256,190 256,60 276,175" fill="url(#goldVeryLight)" />
    <!-- Top-Left Facet -->
    <polygon points="256,190 256,60 236,175" fill="url(#goldMedium)" />
    
    <!-- Right-Bottom Facet -->
    <polygon points="256,190 376,190 276,205" fill="url(#goldMedium)" />
    <!-- Right-Top Facet -->
    <polygon points="256,190 376,190 276,175" fill="url(#goldDark)" />
    
    <!-- Bottom-Left Facet -->
    <polygon points="256,190 256,280 236,205" fill="url(#goldMedium)" />
    <!-- Bottom-Right Facet -->
    <polygon points="256,190 256,280 276,205" fill="url(#goldDark)" />
    
    <!-- Left-Top Facet -->
    <polygon points="256,190 136,190 236,175" fill="url(#goldVeryLight)" />
    <!-- Left-Bottom Facet -->
    <polygon points="256,190 136,190 236,205" fill="url(#goldDark)" />
  </g>

  <!-- Horizon Curve (The Planet Body) -->
  <path d="M 0 350 Q 256 278 512 350 L 512 512 L 0 512 Z" fill="url(#horizonGrad)" />

  <!-- Winding Pathway (Tapers from bottom to the horizon center) -->
  <path d="M 210 512 C 240 470, 310 440, 250 370 C 210 320, 250 290, 256 278 C 252 290, 218 320, 262 370 C 330 440, 260 470, 302 512 Z" fill="url(#roadGrad)" />

  <!-- Glowing Edge of the Horizon (Drawn on top to blend the pathway) -->
  <path d="M 0 350 Q 256 278 512 350" fill="none" stroke="url(#horizonGlowGrad)" stroke-width="4.5" />
  <path d="M 0 350 Q 256 278 512 350" fill="none" stroke="#ffd59e" stroke-width="2" opacity="0.8" filter="url(#glow)" />
</svg>