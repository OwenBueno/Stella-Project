events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:3000;
    }

    # HTTP — redirect to HTTPS in production after certbot
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Uncomment after: certbot --nginx -d api.yourdomain.com
